<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LiveKit Full Stack</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 18px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}input,button{font:inherit;padding:10px 12px}input{flex:1;min-width:220px}#status{padding:12px;background:#f2f2f2;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>LiveKit + OpenAI Realtime</h1><p>Teste pelo microfone.</p><div class="controls"><input id="roomName" value="teste-microfone"><button id="connect">Conectar microfone</button><button id="disconnect" disabled>Desconectar</button></div><div id="status">Desconectado.</div><div id="audio"></div><script type="module">import{Room,RoomEvent,Track,createLocalAudioTrack}from"https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.esm.mjs";const s=document.getElementById("status"),c=document.getElementById("connect"),d=document.getElementById("disconnect"),r=document.getElementById("roomName"),a=document.getElementById("audio");let room,mic;c.onclick=async()=>{c.disabled=true;try{const name=r.value.trim()||"teste-microfone";const res=await fetch(`/token?room=${encodeURIComponent(name)}`);if(!res.ok)throw new Error(`HTTP ${res.status}`);const x=await res.json();room=new Room({adaptiveStream:true,dynacast:true});room.on(RoomEvent.TrackSubscribed,async track=>{if(track.kind!==Track.Kind.Audio)return;const el=track.attach();el.autoplay=true;a.appendChild(el);await el.play().catch(console.warn)});room.on(RoomEvent.Disconnected,()=>{s.textContent="Desconectado.";c.disabled=false;d.disabled=true});s.textContent="Conectando...";await room.connect(x.url,x.token);mic=await createLocalAudioTrack({echoCancellation:true,noiseSuppression:true,autoGainControl:true});await room.localParticipant.publishTrack(mic);s.textContent=`Conectado à sala ${x.room}. Fale com o agente.`;d.disabled=false}catch(e){s.textContent=`Erro: ${e.message}`;c.disabled=false;if(room)await room.disconnect()}};d.onclick=async()=>{if(mic){mic.stop();mic=undefined}if(room){await room.disconnect();room=undefined}a.replaceChildren()};</script></body></html>
