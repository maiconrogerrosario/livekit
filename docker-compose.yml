services:
  redis:
    image: redis:7-alpine
    container_name: livekit-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks: [livekit-net]

  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit-sfu
    restart: unless-stopped
    command: --config /etc/livekit/livekit.yaml
    depends_on: [redis]
    volumes:
      - ./config/livekit.yaml:/etc/livekit/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    networks: [livekit-net]

  sip:
    image: livekit/sip:latest
    container_name: livekit-sip
    restart: unless-stopped
    depends_on: [redis, livekit]
    environment:
      SIP_CONFIG_BODY: |
        api_key: "${LIVEKIT_API_KEY}"
        api_secret: "${LIVEKIT_API_SECRET}"
        ws_url: "${LIVEKIT_URL}"
        redis:
          address: "redis:6379"
        sip_port: ${SIP_PORT}
        rtp_port: ${RTP_PORT_START}-${RTP_PORT_END}
        use_external_ip: ${SIP_USE_EXTERNAL_IP}
        logging:
          level: debug
    ports:
      - "${SIP_PORT}:${SIP_PORT}/udp"
      - "${SIP_PORT}:${SIP_PORT}/tcp"
      - "${RTP_PORT_START}-${RTP_PORT_END}:${RTP_PORT_START}-${RTP_PORT_END}/udp"
    networks: [livekit-net]

  agent:
    build: ./agent
    container_name: livekit-realtime-agent
    restart: unless-stopped
    env_file: [.env]
    depends_on: [livekit]
    networks: [livekit-net]

  web:
    build: ./web
    container_name: livekit-mic-test
    restart: unless-stopped
    env_file: [.env]
    depends_on: [livekit]
    ports:
      - "8080:8080"
    networks: [livekit-net]

volumes:
  redis-data:

networks:
  livekit-net:
    driver: bridge
